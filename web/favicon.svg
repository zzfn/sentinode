<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- 深色背景 -->
  <rect width="32" height="32" rx="7" fill="#1E293B"/>
  <!-- 连接线 -->
  <line x1="7" y1="24" x2="16" y2="9"  stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="9"  x2="25" y2="24" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="7" y1="24" x2="25" y2="24" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 三个节点：emerald / violet / amber -->
  <circle cx="7"  cy="24" r="3.2" fill="#34D399"/>
  <circle cx="16" cy="9"  r="3.2" fill="#8B5CF6"/>
  <circle cx="25" cy="24" r="3.2" fill="#FBBF24"/>
</svg>
